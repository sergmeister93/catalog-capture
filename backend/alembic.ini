# Alembic configuration for Service Photo POC.
# The migration directory is inside the Python package so models are
# importable from env.py without sys.path gymnastics.

[alembic]
script_location = src/service_photo/db/migrations
prepend_sys_path = .

# Use %(here)s so the path is relative to this ini file's directory.
# Override with -x db_url=... or by setting DATABASE_URL in the environment.
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/service_photo_dev

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
